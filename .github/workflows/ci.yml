# Runs on every push / PR. Offline only: no API keys, no API cost.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (exact versions from uv.lock)
        run: uv sync --locked
      - name: Lint + unit tests
        run: uv run poe test
      - name: Retrieval regression gate (synthetic corpus, offline)
        run: uv run pytest tests/unit/test_eval_gate.py -q
      - name: CLI smoke test
        run: uv run raglab --help
