# Runs on every `git commit` once installed:  uv run poe setup  (or: uv run pre-commit install)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key        # blocks committed private keys
      - id: check-added-large-files   # blocks PDFs / model files sneaking in
        args: ["--maxkb=1000"]
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-env-file
        name: never commit .env
        entry: ".env files must not be committed (use .env.example)"
        language: fail
        files: '(^|/)\.env$'
