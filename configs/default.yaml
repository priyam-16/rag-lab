# Baseline configuration. Every experiment later = a copy of this file with one thing changed.
name: baseline

corpus:
  raw_dir: data/raw

chunking:
  strategy: fixed          # later: recursive, semantic, parent_child, contextual
  chunk_size: 1200         # characters
  chunk_overlap: 200

embedding:
  provider: litellm        # hosted: fast, ~2-5 cents per full ingest. Needs OPENAI_API_KEY
  model: text-embedding-3-small
  # provider: fastembed    # local ONNX model: free, no key, slower on a laptop CPU
  # model: BAAI/bge-small-en-v1.5

vector_store:
  collection: raglab_baseline
  local_path: data/qdrant  # used when QDRANT_URL is not set

retrieval:
  top_k: 5

generation:
  # Any LiteLLM model string. Check provider consoles for current model names.
  model: groq/openai/gpt-oss-120b      # free tier on Groq; reasoning model -> needs max_tokens >= 2000
  # model: groq/llama-3.1-8b-instant   # fastest/cheapest comparison
  # model: anthropic/claude-sonnet-4-5
  temperature: 0.0
  max_tokens: 2000
