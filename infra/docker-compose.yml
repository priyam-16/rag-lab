# Local "production-like" stack: real Qdrant server + the API.
#   docker compose -f infra/docker-compose.yml up --build
# Then ingest into it:
#   docker compose -f infra/docker-compose.yml run --rm api ingest --config configs/default.yaml
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  api:
    build: { context: .., dockerfile: infra/Dockerfile }
    env_file: ../.env
    environment:
      QDRANT_URL: http://qdrant:6333   # overrides .env: talk to the container above
    volumes: ["../data/raw:/app/data/raw:ro"]
    ports: ["8000:8000"]
    depends_on: [qdrant]

volumes:
  qdrant_data:
