[project]
name = "raglab"
version = "0.1.0"
description = "Advanced RAG lab: modular retrieval pipeline with cross-model benchmarking on financial regulatory documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "qdrant-client>=1.10",
    "fastembed>=0.4",
    "litellm>=1.50",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
